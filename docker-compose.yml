services:
  client:
    build: .
    environment:
      CLIENT_DATA_PATH: /data
      CLIENT_DISPLAY_PORT: 3000
      DISPLAY_DIST_PATH: /app/dist/display
      SERVER_BASE_URL: ${SERVER_BASE_URL:-http://host.docker.internal:4000}
      KIOSK_URL: ${KIOSK_URL:-http://localhost:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    volumes:
      - client-data:/data

volumes:
  client-data:

