services:
  client:
    build: .
    restart: unless-stopped
    environment:
      CLIENT_DATA_PATH: /data
      CLIENT_DISPLAY_PORT: 3000
      DISPLAY_DIST_PATH: /app/dist/display
      SERVER_BASE_URL: ${SERVER_BASE_URL:-http://epi-info-server:4000}
      CLIENT_NAME: ${CLIENT_NAME:-Epi Info Display}
      CLIENT_ENROLLMENT_TOKEN: ${CLIENT_ENROLLMENT_TOKEN:-}
      CLIENT_SOFTWARE_VERSION: ${CLIENT_SOFTWARE_VERSION:-1.0.0}
      CLIENT_HEARTBEAT_INTERVAL_SECONDS: ${CLIENT_HEARTBEAT_INTERVAL_SECONDS:-30}
      CLIENT_REQUEST_TIMEOUT_MS: ${CLIENT_REQUEST_TIMEOUT_MS:-10000}
      CLIENT_ASSET_DOWNLOAD_TIMEOUT_MS: ${CLIENT_ASSET_DOWNLOAD_TIMEOUT_MS:-300000}
      CLIENT_RETRY_MIN_SECONDS: ${CLIENT_RETRY_MIN_SECONDS:-5}
      CLIENT_RETRY_MAX_SECONDS: ${CLIENT_RETRY_MAX_SECONDS:-60}
      KIOSK_URL: ${KIOSK_URL:-http://localhost:3000}
    ports:
      - "${CLIENT_DISPLAY_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    volumes:
      - client-data:/data
    networks:
      - epi-info

volumes:
  client-data:

networks:
  epi-info:
    external: true
    name: epi-info-network
