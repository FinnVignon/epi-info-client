services:
  client:
    build: .
    restart: unless-stopped
    environment:
      CLIENT_DATA_PATH: /data
      CLIENT_DISPLAY_HOST: 0.0.0.0
      CLIENT_DISPLAY_PORT: 3000
      DISPLAY_DIST_PATH: /app/dist/display
      SERVER_BASE_URL: ${SERVER_BASE_URL:-http://host.docker.internal:4000}
      CLIENT_NAME: ${CLIENT_NAME:-Epi Info Display}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${CLIENT_DISPLAY_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    volumes:
      - client-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
volumes:
  client-data:
